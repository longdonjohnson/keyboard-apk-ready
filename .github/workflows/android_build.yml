name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # README specifies v14+, 18 is a good LTS choice.

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Install project dependencies
      run: npm install # package.json is at the root

    # Ensure npm install completes and project is initialized before adding platform
    - name: Add Android platform
      run: cordova platform add android

    - name: Build debug APK
      run: cordova build android # This builds the debug APK by default

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        # Path from README: platforms/android/app/build/outputs/apk/debug/
        # Cordova typically names it app-debug.apk
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
