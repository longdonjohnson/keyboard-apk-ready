name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Necessary for `npx cap version` if used, and good practice

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # Specify a Node version, LTS is a good default

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: pnpm install # Based on the presence of pnpm-lock.yaml

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli

    - name: Build web assets
      run: pnpm build # Assuming 'build' is the script name in package.json

    # It's better if the android platform is already added and committed to the repo.
    # If not, this step would be needed.
    # - name: Add Android platform
    #   run: npx cap add android

    - name: Synchronize Capacitor project
      run: npx cap sync android

    - name: Navigate to Android directory
      run: cd android

    - name: Grant execute permission for gradlew
      working-directory: ./android # Run this command in the android directory
      run: chmod +x gradlew

    - name: Build debug APK
      working-directory: ./android # Run this command in the android directory
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
