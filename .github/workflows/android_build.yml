name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # README specifies v14+, 18 is a good LTS choice.

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Install project dependencies
      # The README mentions `cd faster-keyboard` then `npm install`.
      # This implies the package.json might be in a subdirectory.
      # However, current file listing shows package.json at the root.
      # Assuming package.json is at the root for now.
      run: npm install

    # The README implies `pnpm` is not used, so `npm install` is appropriate.
    # Also, `pnpm build` is not mentioned; Cordova handles the build.

    - name: Add Android platform
      run: cordova platform add android

    # No separate web asset build step like `npm run build` is mentioned for Cordova in the README.
    # `cordova build android` handles packaging web assets.
    # No `npx cap sync android` needed for Cordova.
    # No `cd android` needed before build for Cordova.
    # No `chmod +x gradlew` needed before build for Cordova, as `cordova build` handles it.

    - name: Build debug APK
      run: cordova build android # This builds the debug APK by default

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        # Path from README: platforms/android/app/build/outputs/apk/debug/
        # Cordova typically names it app-debug.apk
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
